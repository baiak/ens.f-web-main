<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educação Adventista - Ensino Fundamental</title>
    <link rel="stylesheet" href="loadpage.css">
</head>
<body>
    <div class="loading-container">
        <!-- Background animado -->
        <div class="animated-background"></div>
        
        <!-- Livro animado -->
        <div class="book-container">
            <div class="book-cover">
                <div class="book-shine"></div>
                <img src="https://via.placeholder.com/300x400/8b4513/ffffff?text=Educa%C3%A7%C3%A3o+Adventista+2" alt="Educação Adventista 2º bimestre">
            </div>
        </div>
        
        <!-- Título com animação -->
        <div class="title-container">
            <h1 class="title-main">Educação Adventista</h1>
            <p class="title-sub">Ensino Fundamental - 2º Bimestre</p>
            <div class="title-number">2</div>
        </div>
        
        <!-- Carregamento animado -->
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        <p class="loading-text">Carregando...</p>
        
        <!-- Partículas flutuantes -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        
        <!-- Botão para prosseguir -->
        <button class="continue-btn">Continuar →</button>
    </div>

    <script src="loadpage.js"></script>
</body>
</html>
